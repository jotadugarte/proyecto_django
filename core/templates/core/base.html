<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego - {% block title %}Imperio Galáctico{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        nav {
            width: 250px;
            background-color: #161b22;
            padding: 20px;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        nav h2 {
            margin-top: 0;
            color: #58a6ff;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            margin-bottom: 10px;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            display: block;
            padding: 8px;
            border-radius: 6px;
        }

        nav a:hover,
        nav a.active {
            background-color: #21262d;
            color: #58a6ff;
        }

        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .resource-list {
            display: flex;
            gap: 20px;
        }

        .resource-item {
            text-align: center;
        }

        .resource-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #3fb950;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(27, 31, 35, 0.15);
            border-radius: 6px;
            appearance: none;
            background-color: #2ea44f;
            color: #fff;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #2c974b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #30363d;
        }
    </style>
</head>

<body>
    <nav>
        <h2>Imperio</h2>
        {% if user.is_authenticated %}
        <p>Dictador: <strong>{{ user.username }}</strong></p>
        <h3>Mis Planetas</h3>
        <ul>
            {% for p in my_planets %}
            <li>
                <a href="{% url 'planet_detail' p.id %}" class="{% if p.id == planet.id %}active{% endif %}">
                    {{ p.name }} <small>[{{ p.orbit_index }}:{{ p.system.number }}]</small>
                </a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p><a href="/admin/">Iniciar Sesión</a></p>
        {% endif %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>
